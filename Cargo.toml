[package]
name = "ztl-secure"
version = "0.1.0"
edition = "2021"
description = "AES-256-GCM, ECDSA P-256 and SHA-384 behind one CryptoEngine trait, with an optional strict nonce policy."
authors = ["James Thornton"]
repository = "https://github.com/cyber-physical-engineering/secure_crate"
license = "MIT"
keywords = ["cryptography", "aes-gcm", "ecdsa", "p256", "hkdf"]
categories = ["cryptography", "authentication"]

# Break out of the parent workspace
[workspace]

[dependencies]
sha2 = "0.10"
aes-gcm = "0.10"
rand = "0.8"
thiserror = "1.0"
base64 = "0.21"
hkdf = "0.12"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8", "pem"] }

[dev-dependencies]
rand_core = { version = "0.6", features = ["getrandom"] }
